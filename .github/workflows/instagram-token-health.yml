name: Check Instagram token

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v23.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: token
        name: Verify token without exposing it
        continue-on-error: true
        run: node automation/check-instagram-token.mjs

      - name: Open one token alert
        if: steps.token.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Instagram token needs attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The daily private token check failed. Regenerate the Instagram access token, update the \`INSTAGRAM_ACCESS_TOKEN\` Actions secret, and rerun this workflow.\n\n[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            }

      - name: Close resolved token alerts
        if: steps.token.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Instagram token needs attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The token check is healthy again; closing this alert automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the run after creating the alert
        if: steps.token.outcome == 'failure'
        run: exit 1
