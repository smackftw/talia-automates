name: Monitor automation failures

on:
  workflow_run:
    workflows:
      - Publish Instagram content
      - Collect Instagram insights
      - Build weekly content drafts
      - Check Instagram token
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover-or-alert:
    if: >-
      ${{ contains(
        fromJSON('["failure","cancelled","timed_out","stale"]'),
        github.event.workflow_run.conclusion
      ) }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry one scheduled publication, otherwise open an alert
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflow = run.name;
            const retryable =
              workflow === 'Publish Instagram content' &&
              run.event === 'schedule' &&
              run.run_attempt === 1;

            if (retryable) {
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.notice(`Automatic retry requested for publication run ${run.id}.`);
                return;
              } catch (error) {
                core.warning(`Automatic retry failed: ${error.message}`);
              }
            }

            const title = `Automation failed: ${workflow}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const body = [
              `Workflow **${workflow}** failed.`,
              '',
              `[Open the failed run](${run.html_url})`,
              '',
              'Automatic recovery was unavailable or already attempted.',
            ].join('\n');
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  close-resolved-alert:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close a resolved workflow alert
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run.name;
            const title = `Automation failed: ${workflow}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(issue => issue.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: 'A later run completed successfully; closing this alert automatically.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
