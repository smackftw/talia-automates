name: Monitor automation failures

on:
  workflow_run:
    workflows:
      - Publish Instagram content
      - Collect Instagram insights
      - Build weekly content drafts
      - Check Instagram token
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open one alert per failing workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run.name;
            const title = `Automation failed: ${workflow}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const body = [
              `Workflow **${workflow}** failed.`,
              '',
              `[Open the failed run](${context.payload.workflow_run.html_url})`,
              '',
              'The monitor will not create duplicates while this issue remains open.',
            ].join('\n');
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
