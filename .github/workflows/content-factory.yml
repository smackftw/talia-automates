name: Build weekly content drafts

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-content-factory
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.CONTENT_FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/talia-kokoro
          key: kokoro-onnx-int8-${{ runner.os }}-v1

      - name: Install deterministic renderer
        working-directory: factory
        run: npm ci

      - name: Install cloud voice runtime
        run: python -m pip install kokoro-onnx soundfile

      - name: Download cached Kokoro model files
        shell: bash
        run: |
          mkdir -p ~/.cache/talia-kokoro
          if [[ ! -f ~/.cache/talia-kokoro/kokoro-v1.0.int8.onnx ]]; then
            curl --fail --location --retry 3 --output ~/.cache/talia-kokoro/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          fi
          if [[ ! -f ~/.cache/talia-kokoro/voices-v1.0.bin ]]; then
            curl --fail --location --retry 3 --output ~/.cache/talia-kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: Select topics and render two carousels plus one Reel
        working-directory: factory
        shell: bash
        run: npm run select && KOKORO_MODEL_DIR="$HOME/.cache/talia-kokoro" python scripts/generate_voice.py && npm run render

      - name: Optionally approve without review
        if: vars.CONTENT_AUTO_APPROVE == 'true'
        shell: bash
        run: |
          batch_date=$(node -e "console.log(require('./factory/current-batch.json').batchDate)")
          first_date=$(node -e "const d=new Date(); d.setUTCDate(d.getUTCDate()+1); console.log(d.toISOString().slice(0,10))")
          node factory/scripts/approve-batch.mjs "$batch_date" "$first_date"

      - id: batch
        name: Read batch date
        shell: bash
        run: |
          batch_date=$(node -e "console.log(require('./factory/current-batch.json').batchDate)")
          echo "date=$batch_date" >> "$GITHUB_OUTPUT"

      - name: Save rendered drafts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory/state.json factory/current-batch.json media/drafts automation/approved-content.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build weekly content drafts"
          git pull --rebase
          git push

      - name: Create or update the review issue
        uses: actions/github-script@v7
        env:
          BATCH_DATE: ${{ steps.batch.outputs.date }}
        with:
          script: |
            const fs = require('fs');
            const date = process.env.BATCH_DATE;
            const manifest = JSON.parse(fs.readFileSync(`media/drafts/${date}/manifest.json`, 'utf8'));
            const title = `Review Talia content batch: ${date}`;
            const previews = manifest.items.map((item, index) => {
              const url = item.type === 'carousel' ? item.imageUrls[0] : item.videoUrl;
              return `### ${index + 1}. ${item.type} — ${item.topicId}\n\n${item.type === 'carousel' ? `![Preview](${url})` : `[Open Reel](${url})`}\n\n<details><summary>Caption</summary>\n\n${item.caption}\n\n</details>`;
            }).join('\n\n');
            const body = `${previews}\n\n## Approval\n\nIf all three are good, run **Approve content batch** and enter batch date \`${date}\` plus the first publication date. The posts will be spaced one per day.\n\nNothing in this batch is published before approval.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
